name: KV Lint

on:
  push:
    branches: ["*"]
    paths:
      - "translations/**"
      - "configs/**"
      - "kv-lint.toml"
      - ".github/workflows/kv-lint.yml"
  pull_request:
    branches: ["*"]
    paths:
      - "translations/**"
      - "configs/**"
      - "kv-lint.toml"
      - ".github/workflows/kv-lint.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  kv-lint:
    name: KV Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          submodules: false
      - name: Init workspace
        shell: bash
        run: |
          git config --global --add safe.directory "*"
      - name: Lint KeyValues
        uses: jvnipers/kv-lint@v1
        with:
          output: kv-lint-results.txt
      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: kv-lint-results
          path: kv-lint-results.txt
          if-no-files-found: ignore
