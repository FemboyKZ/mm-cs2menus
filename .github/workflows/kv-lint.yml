name: KV Lint

on:
  push:
    branches: ["*"]
    paths:
      - "translations/**"
      - "configs/**"
      - "kv-lint.toml"
      - ".github/workflows/kv-lint.yml"
  pull_request:
    branches: ["*"]
    paths:
      - "translations/**"
      - "configs/**"
      - "kv-lint.toml"
      - ".github/workflows/kv-lint.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  kv-lint:
    name: KV Lint
    runs-on: self-hosted
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name : Init workspace
        shell: bash
        run: |
          git config --global --add safe.directory "*"
      - name: Lint KeyValues
        uses: jvnipers/kv-lint@v1
